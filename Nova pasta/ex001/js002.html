<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>
            JavaScript
        </title>
        <script>
            function myFunction() {
                document.getElementById("demo").innerHTML = "Mudança de Texto";
            }
        </script>
    </head>
    <body>
        <h1>
            Js interno
        </h1>
        <p id="demo">
            Este é um paragrafo
        </p>
        <button type="button" onclick="myFunction()">
            Clique aqui
        </button>
    </body>
</html>
