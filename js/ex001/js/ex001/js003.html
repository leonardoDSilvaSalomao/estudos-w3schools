<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>
            JavaScript
        </title>
    </head>
    <body>
        <h1>
            JS interno
        </h1>
        <p id="demo">
            Este é um paragrafo
        </p>
        <button type="button" onclick="myFunction()">
            Clique
        </button>
        <script>
            function myFunction() {
                document.getElementById("demo").innerHTML = "Mudança de Texto";
            }
        </script>
    </body>

</html>
